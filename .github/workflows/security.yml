name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  secrets-and-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Forbidden insecure patterns
        run: |
          set -e
          ! grep -rnE "badCertificateCallback|HttpOverrides|rejectUnauthorized:\s*false" app/lib api/src api/api
          ! grep -rnE "NODE_TLS_REJECT_UNAUTHORIZED\s*=" api app --include=*.json --include=*.env* --include=*.ts | grep -v "api/src/lib/env.ts"
          ! grep -rnE "Math\.random" api/src api/api --include=*.ts | grep -v "api/src/simulation/"
          ! grep -rniE "md5|sha1|createCipher\(|AES-?ECB" app/lib api/src api/api
          ! grep -rnE "service_role|SERVICE_ROLE" app/lib
          ! grep -rnE "innerHTML|HtmlElementView|dangerouslySetInnerHTML" app/lib
          ! grep -rnE "\.select\(\s*['\"]\*['\"]" app/lib api/src api/api

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
