name: acme_control
description: ACME Control - industrial water-treatment supervisory client (web, Android, iOS).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Placeholder dependency list from PRD. Resolve to current stable versions at implementation
# time (`flutter pub upgrade --major-versions`) - see skills/release-supply-chain.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  supabase_flutter: ^2.8.0
  # Secure local storage for session tokens / offline cache keys (see skills/client-data-protection)
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
