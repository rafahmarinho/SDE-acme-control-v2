name: acme_control
description: ACME Control - industrial water-treatment supervisory client (web, Android, iOS).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Commit pubspec.lock. Before each release run `flutter pub outdated` and upgrade to the
# current stable versions; Dependabot (.github/dependabot.yml) tracks advisories.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^6.1.0
  cryptography: ^2.7.0
  http: ^1.2.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
